<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#ffffff"/>
  
  <!-- Mosque Icon in Emerald Green -->
  <g transform="translate(256, 256)">
    <!-- Main Dome -->
    <ellipse cx="0" cy="-40" rx="80" ry="60" fill="#10b981"/>
    
    <!-- Crescent Moon on top of dome -->
    <path d="M -10,-95 Q -10,-105 0,-105 Q 5,-105 5,-100 Q 5,-95 0,-100 Z" fill="#10b981"/>
    
    <!-- Left Minaret -->
    <g transform="translate(-100, 0)">
      <rect x="-10" y="-20" width="20" height="100" fill="#10b981"/>
      <rect x="-15" y="-30" width="30" height="10" fill="#10b981"/>
      <circle cx="0" cy="-40" r="15" fill="#10b981"/>
      <path d="M -5,-55 Q 0,-60 5,-55" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>
    
    <!-- Right Minaret -->
    <g transform="translate(100, 0)">
      <rect x="-10" y="-20" width="20" height="100" fill="#10b981"/>
      <rect x="-15" y="-30" width="30" height="10" fill="#10b981"/>
      <circle cx="0" cy="-40" r="15" fill="#10b981"/>
      <path d="M -5,-55 Q 0,-60 5,-55" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>
    
    <!-- Main Building -->
    <rect x="-90" y="10" width="180" height="90" fill="#10b981"/>
    
    <!-- Door/Entrance -->
    <path d="M -30,40 Q -30,20 0,20 Q 30,20 30,40 L 30,100 L -30,100 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Windows -->
    <circle cx="-50" cy="50" r="12" fill="#ffffff" opacity="0.8"/>
    <circle cx="50" cy="50" r="12" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
